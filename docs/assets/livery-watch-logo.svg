<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title description">
  <title id="title">Livery Watch</title>
  <desc id="description">A curved white Boeing 747-8 profile in an orange circle beside the Livery Watch wordmark.</desc>
  <rect width="960" height="240" rx="38" fill="#081c2b"/>
  <circle cx="124" cy="120" r="66" fill="#ed6a4c"/>
  <g fill="#ffffff" transform="translate(248 0) scale(-1 1)">
    <!-- Smooth side profile: rounded 747 nose, upper-deck hump, fuselage, and tall swept tail. -->
    <path d="M58 123
      C64 117 73 113 84 110
      C89 103 97 99 107 99
      C117 99 124 103 131 108
      C138 112 148 114 161 114
      L169 114
      C175 109 181 99 186 90
      C188 87 191 88 190 93
      L185 116
      L191 119
      C194 121 193 124 189 125
      L174 128
      C154 132 132 136 108 139
      C95 141 82 141 74 138
      C66 136 60 132 58 127
      C57 125 57 124 58 123Z"/>
    <!-- Swept main wing. -->
    <path d="M103 130
      C124 128 145 125 166 120
      L138 143
      C135 146 131 147 128 145
      L106 135Z"/>
    <!-- Port-side engine nacelles and pylons; their pairing signals the 747's four-engine wing. -->
    <path d="M116 136 L121 135 L123 142 L120 143Z"/>
    <path d="M115 144 C117 142 124 142 127 144 C129 146 128 149 126 151 C123 153 117 152 115 150 C113 148 113 146 115 144Z"/>
    <path d="M137 131 L142 130 L145 138 L141 139Z"/>
    <path d="M138 140 C141 138 148 138 151 140 C153 142 152 145 150 147 C147 149 141 148 138 146 C136 144 136 142 138 140Z"/>
    <!-- Horizontal stabilizer. -->
    <path d="M165 120 L184 111 L187 112 L179 122Z"/>
  </g>
  <text x="224" y="120" fill="#ffffff" font-family="Manrope, Inter, system-ui, sans-serif" font-size="65" font-weight="800" letter-spacing="-3">LIVERY <tspan fill="#ed6a4c">WATCH</tspan></text>
  <text x="229" y="158" fill="#adc0c3" font-family="DM Mono, ui-monospace, monospace" font-size="16" font-weight="500" letter-spacing="4">REGISTRATION-FIRST RARE-BIRD TRACKING</text>
  <rect x="229" y="178" width="122" height="5" rx="2.5" fill="#f3be57"/>
</svg>
